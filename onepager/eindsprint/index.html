<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Hero 6</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f5f5f5;">
    <nav class="navbar">
        <a href="#header" style="display: flex; align-items: center; height: 75px;">
            <img src="images/Logogroepering.png" alt="" class="desktop-only" style="width: 200px; height: auto;">
            <img src="images/Logo.png" alt="" class="mobile-only" style="width: 50px; height: auto;">
        </a>

        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nav-links" id="navLinks">
            <a href="#wie-zijn-wij" onclick="toggleMenu()">Over ons</a>
            <a href="#situaties" onclick="toggleMenu()">Project</a>
            <a href="#sprints" onclick="toggleMenu()">Eerdere sprints</a>
        </div>
    </nav>

    <header style="display: flex; justify-content: center; align-items: center;">
        <div id="header" style="display: flex; justify-content: center; align-items: center; width: 100%;">
            <img src="images/desktop/Header.png" class="desktop-only" alt="" style="width: 80vw; height: auto;">
            <img src="images/mobile/Header.png" class="mobile-only" alt="">
        </div>
    </header>

    <main style="display: flex; flex-direction: column; width: 100%; overflow-x: hidden; align-items: center;">
        
        <div id="wie-zijn-wij" style="display: flex; justify-content: center; width: 100%;">
            <img src="images/desktop/Wie zijn wij.png" class="desktop-only" alt="Wie zijn wij?..." style="width: 80vw; height: auto;">
            <img src="images/mobile/Wie zijn wij.png" class="mobile-only" alt="Wie zijn wij?..." style="width: 80vw; height: auto;">
        </div>

        <img src="images/desktop/Ons team frame.png" class="desktop-only" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
        <img src="images/mobile/Ons team frame.png" class="mobile-only" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
        
        <div style="margin-top: 40px; margin-bottom: 40px;">
            <h1 class="title-kernwaarden">Onze kernwaarden</h1>
            <div class="carousel-container">
                <div class="arrow prev" onclick="moveSlide(-1)"></div>
                <div class="carousel-track" id="track">
                    <img src="images/kernwaarden/1vrijheid.png" alt="Vrijheid">
                    <img src="images/kernwaarden/2betrouwbaarheid.png" alt="Betrouwbaarheid">
                    <img src="images/kernwaarden/3veiligheid.png" alt="Veiligheid">
                    <img src="images/kernwaarden/4gemak.png" alt="Gemak">
                    <img src="images/kernwaarden/5eerlijkheid.png" alt="Eerlijkheid">
                </div>
                <div class="arrow next" onclick="moveSlide(1)"></div>
            </div>
        </div>

        <img src="images/desktop/Situaties.png" id="situaties" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
        <img src="images/desktop/Ontwerpvragen.png" id="ontwerpvragen" alt="" style="width: 50vw; height: auto;">
        <img src="images/desktop/sprint 5/Eindproduct.png" id="probe" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">

        <div class="colored-section-container" id="sprints">
            <div id="sprint0-header" class="collapsible-header" onclick="toggleSection('sprint0-container', 'collapsable-arrow-sprint0')">
                <h1 class="title-kernwaarden">Sprint 0</h1>
                <span id="collapsable-arrow-sprint0" class="arrow-icon">▼</span>
            </div>
            <div id="sprint0-container" class="collapsible-content sprint-container" onclick="toggleSection('sprint0-container', 'collapsable-arrow-sprint0')" style="display: flex; flex-direction: column; align-items: center; gap: 20px; cursor: pointer;">
                <img src="images/desktop/sprint 0/Situaties.png" id="situaties" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 0/Ontwerpvragen.png" alt="" style="width: 50vw; height: auto;">
                <img src="images/desktop/sprint 0/Ons proces.png" id="ons-proces" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 0/Next steps doel.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 0/Next steps onderzoek.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 0/Next steps ontwikkelen.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 0/Next steps testen.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 0/Resultaat.png" alt="" style="width: 50vw; height: auto;">
            </div>
        </div>

        <div class="uncolored-section-container">
            <div id="sprint1-header" class="collapsible-header" onclick="toggleSection('sprint1-container', 'collapsable-arrow-sprint1')">
                <h1 class="title-kernwaarden">Sprint 1</h1>
                <span id="collapsable-arrow-sprint1" class="arrow-icon">▼</span>
            </div>
            <div id="sprint1-container" class="collapsible-content sprint-container" onclick="toggleSection('sprint1-container', 'collapsable-arrow-sprint1')" style="display: flex; flex-direction: column; align-items: center; gap: 20px; cursor: pointer;">
                <img src="images/desktop/sprint 1/Ontwerpvragen.png" alt="" style="width: 50vw; height: auto;">
                <img src="images/desktop/sprint 1/Insights algemeen.png" id="insights" alt="" style="width: 100vw; height: auto; overflow-x: hidden; margin-bottom: 75px;">
                <img src="images/desktop/sprint 1/Key insights.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 1/Next steps doel.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 1/Next steps onderzoek.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 1/Next steps ontwikkelen.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 1/Next steps testen.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 1/Resultaat.png" alt="" style="width: 50vw; height: auto;">
            </div>
        </div>

        <div class="colored-section-container">
            <div id="sprint2-header" class="collapsible-header" onclick="toggleSection('sprint2-container', 'collapsable-arrow-sprint2')">
                <h1 class="title-kernwaarden">Sprint 2</h1>
                <span id="collapsable-arrow-sprint2" class="arrow-icon">▼</span>
            </div>
            <div id="sprint2-container" class="collapsible-content sprint-container" onclick="toggleSection('sprint2-container', 'collapsable-arrow-sprint2')" style="display: flex; flex-direction: column; align-items: center; gap: 20px; cursor: pointer;">
                <img src="images/desktop/sprint 2/Situaties.png" id="situaties" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                
                <div class="persona-section" onclick="event.stopPropagation();">
                    <h1 class="title-kernwaarden">Onze individuele persona's</h1>
                    <div class="arrow prev" onclick="movePersona(-1)"></div>
                    <div class="arrow next" onclick="movePersona(1)"></div>
                    <div class="carousel-container persona-container">
                        <div class="carousel-track" id="personaTrack">
                            <div class="persona-group">
                                <img src="images/desktop/sprint 2/personas/ISRA persona 1.png" alt="Persona 1" class="persona-img">
                                <img src="images/desktop/sprint 2/personas/YIM persona 1.png" alt="Persona 2" class="persona-img">
                            </div>
                            <div class="persona-group">
                                <img src="images/desktop/sprint 2/personas/KOEN persona 1.png" alt="Persona 3" class="persona-img">
                                <img src="images/desktop/sprint 2/personas/DAVID persona 1.png" alt="Persona 4" class="persona-img">
                            </div>
                            <div class="persona-group">
                                <img src="images/desktop/sprint 2/personas/KIANGA persona 1.png" alt="Persona 5" class="persona-img">
                                <img src="images/desktop/sprint 2/personas/JEAN PAUL persona 1.png" alt="Persona 6" class="persona-img">
                            </div>
                        </div>
                    </div>
                </div>

                <img src="images/desktop/sprint 2/Onze definitieve persona.png" id="definitieve-persona" alt="" style="width: 80vw; height: auto; overflow-x: hidden; margin-bottom: 75px;">        
                <img src="images/desktop/sprint 2/Key insights.png" id="insights" alt="" style="width: 100vw; height: auto; overflow-x: hidden; margin-bottom: 75px;">
                <img src="images/desktop/sprint 2/Concepten.png" id="concepten" alt="" style="width: 100vw; height: auto; overflow-x: hidden; margin-bottom: 75px;">
                <img src="images/desktop/sprint 2/Probe.png" id="probe" alt="" style="width: 100vw; height: auto; overflow-x: hidden; margin-bottom: 75px;">
                <img src="images/desktop/sprint 2/Next steps doel.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 2/Next steps onderzoek.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 2/Next steps ontwikkelen+testen.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
            </div>
        </div>

        <div class="uncolored-section-container">
            <div id="sprint3-header" class="collapsible-header" onclick="toggleSection('sprint3-container', 'collapsable-arrow-sprint3')">
                <h1 class="title-kernwaarden">Sprint 3</h1>
                <span id="collapsable-arrow-sprint3" class="arrow-icon">▼</span>
            </div>
            <div id="sprint3-container" class="collapsible-content sprint-container" onclick="toggleSection('sprint3-container', 'collapsable-arrow-sprint3')" style="display: flex; flex-direction: column; align-items: center; gap: 20px; cursor: pointer;">
                <h1 class="title-kernwaarden" style="margin-top: 20px !important;" onclick="event.stopPropagation();">Prototype</h1>
                <img src="images/desktop/sprint 3/Prototype stap 1.png" alt="" style="width: 80vw; height: auto; overflow-x: hidden; margin-bottom: 75px;">
                <img src="images/desktop/sprint 3/Prototype stap 2.png" alt="" style="width: 80vw; height: auto; overflow-x: hidden; margin-bottom: 75px;">
                <img src="images/desktop/sprint 3/Prototype stap 3.png" alt="" style="width: 80vw; height: auto; overflow-x: hidden; margin-bottom: 75px;">
                <img src="images/desktop/sprint 3/Prototype stap 4.png" alt="" style="width: 80vw; height: auto; overflow-x: hidden; margin-bottom: 75px;">
                <img src="images/desktop/sprint 3/Enquete.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden; margin-bottom: 75px;">
                <img src="images/desktop/sprint 3/enquete resultaten.png" alt="" style="width: 90vw; height: auto; overflow-x: hidden; margin-bottom: 100px;">
                
                <img src="images/desktop/sprint 3/Next steps onderzoek.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 3/Next steps ontwikkelen.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 3/Next steps testen.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
            </div>
        </div>

        <div class="colored-section-container">
            <div id="sprint4-header" class="collapsible-header" onclick="toggleSection('sprint4-container', 'collapsable-arrow-sprint4')">
                <h1 class="title-kernwaarden">Sprint 4</h1>
                <span id="collapsable-arrow-sprint4" class="arrow-icon">▼</span>
            </div>
            <div id="sprint4-container" class="collapsible-content sprint-container" onclick="toggleSection('sprint4-container', 'collapsable-arrow-sprint4')" style="display: flex; flex-direction: column; align-items: center; gap: 20px; cursor: pointer;">
                <img src="images/desktop/sprint 4/Situaties.png" id="situaties" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 4/Ontwerpvragen.png" id="ontwerpvragen" alt="" style="width: 50vw; height: auto;">
                <img src="images/desktop/sprint 4/Prototype.png" id="probe" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 4/TestResultaten.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden; margin-bottom: 75px;">

                <img src="images/desktop/sprint 4/Next steps feedback.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 4/Next steps opnieuw testen.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
                <img src="images/desktop/sprint 4/Next steps expo voorbereiden.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
            </div>
        </div>
    </main>

    <footer>
        <a href="mailto:team.big.hero.6.hr@gmail.com">
            <img src="images/desktop/Footer.png" alt="" style="width: 100vw; height: auto; overflow-x: hidden;">
        </a>
    </footer>
    <script type="text/javascript" src="main.js"></script>
</body>

</html>
