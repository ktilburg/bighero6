<!DOCTYPE html>
<html>
<head>
    <title>Get2Know - Lobby</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #2c3e50; color: white; padding-top: 50px; }
        .card { background: #34495e; padding: 30px; border-radius: 15px; display: inline-block; min-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .player-tag { background: #e67e22; padding: 5px 15px; border-radius: 20px; margin: 5px; display: inline-block; }
        .room-status { margin-top: 10px; font-size: 1.1em; }
        button { background: #27ae60; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 1.1em; margin-top: 20px; }
        .muted { color: #dfe6e9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Lobby</h1>
        <div class="room-status">Game ready</div>
        <p class="muted">Wacht tot iedereen binnen is, dan kun je starten.</p>
        <div id="player-list"></div>
        <button id="start-game-btn" onclick="startGame()">START HET SPEL</button>
    </div>

    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const room = urlParams.get('room');

        function renderPlayers(players) {
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            players.forEach(player => {
                if (player.name !== 'HOST') {
                    list.innerHTML += `<span class="player-tag">${player.emoji} ${player.name}</span>`;
                }
            });
        }

        socket.emit('join_game', {room: room, name: 'HOST'});

        socket.on('player_joined', (players) => {
            renderPlayers(players);
        });

        socket.on('joined_game', (data) => {
            if (!room && data.room) {
                window.history.replaceState({}, '', `/host/lobby?room=${encodeURIComponent(data.room)}`);
            }
        });

        socket.on('player_joined', (players) => {
            renderPlayers(players);
        });

        socket.on('join_failed', () => {
            document.querySelector('.room-status').innerText = 'Geen actieve lobby gevonden.';
            document.getElementById('start-game-btn').disabled = true;
        });

        function startGame() {
            socket.emit('start_game', {room: room});
            window.location.href = `/game?name=HOST`;
        }
    </script>
</body>
</html>
