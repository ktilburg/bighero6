<!DOCTYPE html>
<html>
<head>
    <title>Get2Know - Host</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #FFF9E9;
            --card-shadow: 12px 12px 0px rgba(0,0,0,0.15);
            --neo-shadow: 8px 8px 0px #000;
            --neo-shadow-sm: 4px 4px 0px #000;
            --wyr-teal: #1abc9c;
            --wyr-blue: #b4c7ed;
            --statement-pink: #f4b4d6;
            --statement-pink-hover: #e59ec5;
            --statement-yellow: #f8e367;
            --green-brand: #41e2a8;
            --green-brand-hover: #32be8c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            
            background-image: url('/static/images/join_background.png');
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            
            margin: 0; 
            padding: 60px 10px 40px 10px; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            box-sizing: border-box;
        }

        .card { 
            background: white; padding: 60px 30px 40px 30px; border-radius: 40px; 
            display: inline-block; min-width: 400px; max-width: 500px; width: 100%;
            border: 3px solid #000; box-shadow: var(--card-shadow);
            text-align: initial; position: relative; box-sizing: border-box;
        }

        #setup-area { text-align: center; }

        .theme-logo { 
            position: absolute; top: -52px; left: 50%; transform: translateX(-50%); 
            z-index: 4; height: 100px; pointer-events: none;
        }

        h1 { 
            font-size: 36px; font-weight: 900; text-align: center; margin: 0 0 30px 0; color: #000; 
        }

        .slider-box { 
            margin: 20px 0; text-align: left; font-size: 18px; font-weight: 800; color: #000;
        }
        
        .slider-box input[type="range"] {
            -webkit-appearance: none; 
            width: 100%; 
            height: 16px;
            background: #fff; 
            border: 3px solid #000; 
            border-radius: 10px; 
            outline: none; 
            margin-top: 10px;
        }

        .slider-box input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 20px; height: 26px; border-radius: 6px; 
            background: #000; border: 2px solid #fff; cursor: pointer;
        }

        .slider-box input[type="range"]::-moz-range-thumb {
            width: 20px; height: 26px; border-radius: 6px; 
            background: #000; border: 2px solid #fff; cursor: pointer;
        }

        .val { float: right; font-weight: 900; color: #000; font-size: 18px; }

        .toggle-row { margin: 25px 0; text-align: left; }
        
        .checkbox-row {
            display: flex; align-items: center; gap: 15px; cursor: pointer; font-size: 20px; font-weight: 800; color: #000;
            padding: 5px; border-radius: 10px; transition: background 0.1s;
        }
        
        .checkbox-row:hover input {
            border-color: #000;
            background: #fdf6e2;
            transform: scale(1.05);
        }

        .checkbox-row input {
            -webkit-appearance: none; appearance: none;
            width: 30px; height: 30px; border: 3px solid #000; border-radius: 8px;
            background: white; position: relative; cursor: pointer; transition: transform 0.1s, background 0.1s; margin: 0;
        }

        .checkbox-row input:checked { background: #9853C6; }
        .checkbox-row input:checked::after {
            content: '✓'; position: absolute; color: white; font-weight: 900; font-size: 20px;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        input.neo-input-hangman {
            width: 100%;
            padding: 12px 15px;
            border-radius: 16px;
            border: 3px solid #000;
            margin-top: 10px;
            box-sizing: border-box;
            font: inherit;
            font-weight: 600;
            outline: none;
            box-shadow: var(--neo-shadow-sm);
            background-color: #fff;
            color: #000;
        }
        input.neo-input-hangman::placeholder {
            color: rgba(0, 0, 0, 0.45);
            font-weight: 600;
        }

        textarea.neo-textarea-custom {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            border-radius: 20px;
            border: 3px solid #000;
            margin-top: 10px;
            box-sizing: border-box;
            font: inherit;
            font-weight: 600;
            outline: none;
            box-shadow: var(--neo-shadow-sm);
            background-color: #fff;
            color: #000;
            resize: vertical;
        }
        textarea.neo-textarea-custom::placeholder {
            color: #888;
            font-weight: 500;
        }

        textarea, input[type="text"] {
            width: 100%; padding: 15px; border-radius: 20px; 
            border: 3px solid #000; margin-top: 10px; box-sizing: border-box; 
            font: inherit; font-weight: 600; outline: none; box-shadow: var(--neo-shadow-sm);
        }

        button { 
            width: 100%; background: var(--green-brand); color: white; border: 4px solid #000;
            border-radius: 30px; padding: 20px; font-size: 24px; font-weight: 900; cursor: pointer;
            box-shadow: var(--neo-shadow); margin-top: 25px; 
            transition: background 0.1s, transform 0.1s, box-shadow 0.1s;
        }
        button:hover {
            background: var(--green-brand-hover);
        }
        button:active { transform: translate(6px, 6px); box-shadow: 2px 2px 0px #000; }

        .btn-small { 
            padding: 12px 15px; font-size: 16px; margin-top: 12px; 
            background: var(--statement-pink); color: #000; 
            border: 3px solid #000; border-radius: 20px; box-shadow: var(--neo-shadow-sm); font-weight: 800;
            transition: background 0.1s, transform 0.1s, box-shadow 0.1s;
        }
        .btn-small:hover {
            background: var(--statement-pink-hover);
        }
        .btn-small:active { 
            transform: translate(3px, 3px); 
            box-shadow: 1px 1px 0px #000; 
        }

        .custom-questions-list {
            text-align: left; margin-top: 20px; max-height: 220px; overflow-y: auto;
            background: #fff; border: 3px solid #000; border-radius: 20px; padding: 10px;
            box-sizing: border-box;
        }
        
        .custom-questions-list::-webkit-scrollbar {
            width: 8px;
        }
        .custom-questions-list::-webkit-scrollbar-track {
            background: transparent;
            margin: 10px;
        }
        .custom-questions-list::-webkit-scrollbar-thumb {
            background: #000;
            border-radius: 10px;
        }

        .custom-question-item {
            background: var(--statement-yellow); color: #000; border: 3px solid #000;
            padding: 12px 15px; margin: 8px 0; border-radius: 16px; display: flex;
            justify-content: space-between; align-items: center; font-size: 16px;
            font-weight: 800; box-shadow: var(--neo-shadow-sm); word-break: break-word;
        }
        
        .remove-btn {
            background: #000; color: #fff; border: 2px solid #000; border-radius: 50%;
            width: 28px; height: 28px; cursor: pointer; font-weight: 900; font-size: 18px;
            display: flex; align-items: center; justify-content: center; margin-top: 0;
            padding: 0; flex-shrink: 0; margin-left: 12px; box-shadow: none; transition: background 0.1s;
        }
        .remove-btn:hover { background: #e74c3c; color: #fff; }

        hr { border: 0; border-top: 3px dashed #000; margin: 30px 0; width: 100%; }

        .player-tag { 
            background: var(--wyr-blue); color: #000; border: 2px solid #000;
            padding: 6px 16px; border-radius: 20px; margin: 5px; display: inline-block; font-weight: 700;
        }
        
        .room-status { margin-top: 20px; font-size: 1.2em; font-weight: 800; color: #000; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/static/images/get2know_logo.png" class="theme-logo" onerror="this.style.display='none'">

        <div id="setup-area">
            <h1>Game Setup</h1>
            
            <div class="slider-box">Ice Breakers <span class="val" id="v-ice">3 / {{ slider_maxes.ice }}</span><br><input type="range" id="ice" min="0" max="{{ slider_maxes.ice }}" value="3" oninput="updateVal('ice')"></div>
            <div class="slider-box">Minigames <span class="val" id="v-mini">2 / {{ slider_maxes.mini }}</span><br><input type="range" id="mini" min="0" max="{{ slider_maxes.mini }}" value="2" oninput="updateVal('mini')"></div>
            <div class="slider-box">Diepgang <span class="val" id="v-deep">3 / {{ slider_maxes.deep }}</span><br><input type="range" id="deep" min="0" max="{{ slider_maxes.deep }}" value="3" oninput="updateVal('deep')"></div>
            <div class="slider-box">Would You Rather <span class="val" id="v-wy">2 / {{ slider_maxes.wy }}</span><br><input type="range" id="wy" min="0" max="{{ slider_maxes.wy }}" value="2" oninput="updateVal('wy')"></div>
            <div class="slider-box">Statements <span class="val" id="v-st">3 / {{ slider_maxes.st }}</span><br><input type="range" id="st" min="0" max="{{ slider_maxes.st }}" value="3" oninput="updateVal('st')"></div>
            
            <div class="toggle-row">
                <label class="checkbox-row">
                    <input type="checkbox" id="thirty-seconds-enabled" checked>
                    <span>30 seconds</span>
                </label>
            </div>

            <div class="slider-box">
                Hangman woorden<br>
                <input type="text" id="hangman-words" class="neo-input-hangman" placeholder="Voeg extra woorden toe met komma’s of nieuwe regels...">
            </div>            
            <hr>
            
            <div class="slider-box">
                <label for="custom-question-input" style="font-weight: bold;">Zelf vragen toevoegen:</label>
                <textarea id="custom-question-input" class="neo-textarea-custom" placeholder="Type hier je eigen vraag..."></textarea>
                <button type="button" class="btn-small" onclick="addCustomQuestion()">Voeg vraag toe</button>

                <div class="custom-questions-list" id="custom-questions-container">
                </div>
            </div>

            <hr>

            <button onclick="createGame()">Start spel</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = "";
        let customQuestions = [];

        function updateSliderBackground(id) {
            const slider = document.getElementById(id);
            const max = slider.max || 100;
            const value = slider.value;
            const percentage = (value / max) * 100;
            slider.style.background = `linear-gradient(to right, var(--statement-pink) 0%, var(--statement-pink) ${percentage}%, #ffffff ${percentage}%, #ffffff 100%)`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const stored = localStorage.getItem("custom_game_questions");
            if (stored) {
                try {
                    customQuestions = JSON.parse(stored);
                } catch(e) {
                    customQuestions = [];
                }
            }
            renderCustomQuestions();
            ['ice', 'mini', 'deep', 'wy', 'st'].forEach(updateSliderBackground);
        });

        function updateVal(id) { 
            const slider = document.getElementById(id);
            document.getElementById('v-' + id).innerText = `${slider.value} / ${slider.max}`;
            updateSliderBackground(id); 
        }

        ['ice', 'mini', 'deep', 'wy', 'st'].forEach(updateVal);

        function parseWords(text) {
            return text
                .split(/[\n,;]+/)
                .map(word => word.trim())
                .filter(Boolean);
        }

        function addCustomQuestion() {
            const input = document.getElementById("custom-question-input");
            const text = input.value.trim();
            
            if (text === "") return;

            customQuestions.push(text);
            localStorage.setItem("custom_game_questions", JSON.stringify(customQuestions));
            
            input.value = ""; 
            renderCustomQuestions();
        }

        function removeCustomQuestion(index) {
            customQuestions.splice(index, 1);
            localStorage.setItem("custom_game_questions", JSON.stringify(customQuestions));
            renderCustomQuestions();
        }

        function renderCustomQuestions() {
            const container = document.getElementById("custom-questions-container");
            container.innerHTML = "";

            if (customQuestions.length === 0) {
                container.innerHTML = '<div style="padding: 10px; color: #555; font-style: italic; text-align: center; font-weight: 600;">Nog geen eigen vragen toegevoegd.</div>';
                return;
            }

            customQuestions.forEach((question, index) => {
                const item = document.createElement("div");
                item.className = "custom-question-item";
                
                const textSpan = document.createElement("span");
                textSpan.innerText = question;
                
                const removeBtn = document.createElement("button");
                removeBtn.className = "remove-btn";
                removeBtn.innerHTML = "&times;";
                removeBtn.onclick = () => removeCustomQuestion(index);
                
                item.appendChild(textSpan);
                item.appendChild(removeBtn);
                container.appendChild(item);
            });
        }

        function createGame() {
            const settings = {
                ice: document.getElementById('ice').value,
                mini: document.getElementById('mini').value,
                deep: document.getElementById('deep').value,
                wy: document.getElementById('wy').value,
                st: document.getElementById('st').value, 
                hangman_words: parseWords(document.getElementById('hangman-words').value),
                custom_names: false,
                mode: 'mondeling',
                thirty_seconds_enabled: document.getElementById('thirty-seconds-enabled').checked,
                custom_questions: customQuestions
            };
            socket.emit('create_game', {settings: settings});
        }

        socket.on('game_created', (data) => {
            currentRoom = data.room;
            window.location.href = `/host/lobby?room=${encodeURIComponent(currentRoom)}`;
        });
    </script>
</body>
</html>
